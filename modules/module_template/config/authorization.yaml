# module_template authorization contract
#
# Internal logic:
# - This file is the authoritative module_template authorization specification.
# - Authentik is the source of truth for identity and authorization.
# - The module bootstrap process consumes this file directly as the module
#   authorization contract.
# - The contract is idempotent: running it multiple times must not duplicate
#   identities, roles, permissions, or mappings.
# - This file is intentionally scoped to the Items entity and its related
#   authorization data.
# - host_app owns only the initial application-wide authorization bootstrap.
#
# Users are NOT declared here. They arrive from the customer's directory, or
# from config/bootstrap-users.yaml on an installation with no directory connected.
# This file declares what ships with the code: permissions, roles, profiles, and the
# associations the module requires.

profiles: # A list of Profiles each with its metadata and associated Roles
  - profile: template_admin
    description: module_template administrators
    roles: # the list of Roles associated with the Profile
      - template_items_manager
  - profile: template_reader
    description: module_template read-only users
    roles: # the list of Roles associated with the Profile
      - template_items_reader
  - ext_profile: admin # NOTE: The ext_profile keyword indicates that the profile referenced here is defined in another Module (in this case, in host_app).
                       #       This is a special way to associate roles defined here to a profile that is defined esternally.
                       #       Do not define here other profiles pecific data like description, etc. (they whould be ignored to avoid conflicts/overwritings)
                       #       The external Module that defines the profile must be declared in the module's dependencies.
    roles: # the list of Roles associated with the Profile
      - template_items_manager
      # Cross-tenant read is granted HERE and only here: to host_app's application-wide `admin`
      # profile, never to the module's own `template_admin` (which administers ONE tenant's
      # items). Keeping the two apart is what makes "administrator" stop implying "sees
      # everything" — see the role's own comment below.
      - template_items_cross_tenant_reader
roles: # A list of Roles each with its metadata and associated Permissions
  - ext_role: guest # NOTE: The ext_role keyword indicates that the role referenced here is defined in another Module (in this case, in host_app).
                    #       This is a special way to associate permissions defined here to a role that is defined esternally.
                    #       Do not define here other roles pecific data like description, etc. (they whould be ignored to avoid conflicts/overwritings)
                    #       The external Module that defines the role must be declared in the module's dependencies.
    permissions: # the list of Permissions associated with the Role
      - items:view
      - items:menu_access

  - role: template_items_manager
    description: CRUD access to Template Items
    permissions: # the list of Permissions associated with the Role
      - items:view
      - items:edit
      - items:menu_access
      - template:menu_access
      - audit_trail:view
  - role: template_items_cross_tenant_reader
    description: Read Template Items across every tenant (explicit, named, read-only)
    # A tenant filter is widened ONLY when this permission is present in the token — there is no
    # superadmin branch and no early return in the backend, because that is how the isolation was
    # missing in the first place: an implicit "admins see everything" is invisible in the code, in
    # the token and in the audit trail, and it cannot be granted to one person without granting it
    # to every future holder of the same role.
    #
    # Read-only by construction, at BOTH layers: the widening applies to reads only in `crud.py`,
    # and at the database layer the cross-tenant RLS policy is `FOR SELECT`, so an UPDATE or
    # DELETE aimed at another tenant's row still matches nothing. Granting visibility must not
    # grant authority.
    permissions:
      - items:read_all_tenants
      - items:view
      - items:menu_access
  - role: template_items_reader
    description: Read access to Template Items
    permissions: # the list of Permissions associated with the Role
      - items:view
      - items:menu_access
      - template:menu_access
      - audit_trail:view
permissions: # A list of Permissions each with its metadata
  - name: items:view
    description: View template items
  - name: items:edit
    description: Edit template items
  - name: items:read_all_tenants
    description: Read template items belonging to every tenant, not only the user's own
  - name: items:menu_access
    description: Access items menu
  - name: template:menu_access
    description: Access the Template main menu
  - name: audit_trail:view
    description: View the full audit trail history for all entities of this module

