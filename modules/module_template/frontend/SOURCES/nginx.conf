server {
    # 8080, not 80: the image runs as a non-root user and cannot bind a privileged
    # port. Traefik reaches this by service name, so the change is invisible outside the container
    # -- provided traefik/SOURCES/dynamic.yml.template is updated with it.
    listen 8080;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Runtime Look & Feel override, edited live in the deployed config/ folder (no rebuild).
    # NOT content-hashed, so it must never be cached immutably. Exact-match `location =` takes
    # priority over the regex static rule below. 404 when absent is tolerated by the runtime <link>.
    location = /config/theme-override.css {
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    # Runtime configuration generated by docker-entrypoint.sh at container start — the file that
    # makes one image promotable across environments. Same name and contract as host_app's.
    # Never cached: a stale copy silently points the app at the wrong API.
    location = /env-config.js {
        # Served from /tmp, not the html root: the root filesystem is read-only and
        # docker-entrypoint.sh writes this file at container start. Runtime configuration must not
        # require a writable code directory -- generating it at start is the whole point.
        alias /tmp/env-config.js;
        add_header Cache-Control "no-store" always;
        default_type application/javascript;
    }

    # Entry points are NOT content-hashed, so they must revalidate on every load. Caching these
    # immutably is what strands a browser on a manifest whose chunks were deleted by the next
    # deploy: the app breaks until the user discovers a hard refresh, and nothing server-side
    # shows it. Exact/prefix matches take priority over the hashed-asset regex below.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    location = /mf-manifest.json {
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    location = /remoteEntry.js {
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    location = /menu_definition.json {
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # Everything else static: rsbuild content-hashes these filenames, so a changed file gets a new
    # name and `immutable` is safe — that is precisely why the entry points above are excluded.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
