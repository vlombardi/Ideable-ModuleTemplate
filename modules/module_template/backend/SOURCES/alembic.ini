# ASCII ONLY. alembic reads this file with `encoding="locale"`, and `locale.getencoding()`
# deliberately IGNORES Python's UTF-8 mode (PEP 686). The runtime image is distroless and
# carries no locale data, so the locale encoding is ASCII and neither PYTHONUTF8=1 nor
# LANG=C.UTF-8 changes it -- both were measured. A single em dash in a comment here killed
# the migrations job that the whole stack waits on. Pinned by test_ascii_only_config.py.
# Alembic configuration. The database URL is NOT stored here: it comes from DATABASE_URL in the
# environment (see alembic/env.py), so the same image runs against any environment's database.
[alembic]
script_location = alembic

# Chronological, lexicographically-sorted filenames: the versions/ folder reads as a timeline,
# the way a Supabase-style migrations folder does. The revision id inside the file (and its
# down_revision link) is still what defines order -- the filename is for humans.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(slug)s
prepend_sys_path = .
version_path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
